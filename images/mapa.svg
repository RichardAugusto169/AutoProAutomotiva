<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" id="mapa-cidade">
  <!-- fundo do mapa -->
  <rect width="600" height="400" fill="#e8e0d0"/>
  <!-- quadras / blocos -->
  <rect x="30"  y="30"  width="100" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="30"  y="130" width="100" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="30"  y="250" width="100" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="30"  y="330" width="100" height="50"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="160" y="30"  width="120" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="160" y="130" width="120" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="160" y="250" width="120" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="160" y="330" width="120" height="50"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="320" y="30"  width="100" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="320" y="130" width="100" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="320" y="250" width="100" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="320" y="330" width="100" height="50"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="450" y="30"  width="120" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="450" y="130" width="120" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="450" y="250" width="120" height="70"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <rect x="450" y="330" width="120" height="50"  fill="#c8bfa8" stroke="#a09880" stroke-width="1"/>
  <!-- ruas horizontais -->
  <rect x="0"   y="100" width="600" height="30" fill="#d4c9b0" stroke="#b0a898" stroke-width="1"/>
  <rect x="0"   y="220" width="600" height="30" fill="#d4c9b0" stroke="#b0a898" stroke-width="1"/>
  <rect x="0"   y="320" width="600" height="15" fill="#d4c9b0" stroke="#b0a898" stroke-width="1"/>
  <!-- ruas verticais -->
  <rect x="130" y="0"   width="30" height="400" fill="#d4c9b0" stroke="#b0a898" stroke-width="1"/>
  <rect x="280" y="0"   width="30" height="400" fill="#d4c9b0" stroke="#b0a898" stroke-width="1"/>
  <rect x="420" y="0"   width="30" height="400" fill="#d4c9b0" stroke="#b0a898" stroke-width="1"/>
  <!-- nomes das ruas -->
  <text x="300" y="120" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Av. das Indústrias</text>
  <text x="300" y="238" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Rua das Oficinas</text>
  <text x="145" y="60"  text-anchor="middle" font-family="Arial" font-size="9" fill="#666" transform="rotate(-90,145,60)">R. A</text>
  <text x="295" y="60"  text-anchor="middle" font-family="Arial" font-size="9" fill="#666" transform="rotate(-90,295,60)">R. B</text>
  <text x="435" y="60"  text-anchor="middle" font-family="Arial" font-size="9" fill="#666" transform="rotate(-90,435,60)">R. C</text>
  <!-- OFICINA (ponto clicável) -->
  <rect x="162" y="132" width="116" height="66" fill="#cc0000" opacity="0.85" stroke="#800000" stroke-width="2" rx="4"/>
  <text x="220" y="158" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">AutoPro</text>
  <text x="220" y="172" text-anchor="middle" font-family="Arial" font-size="10" fill="#ffe0e0">Oficina</text>
  <text x="220" y="185" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffe0e0">Clique aqui!</text>
  <!-- ponto B - estacionamento -->
  <circle cx="370" cy="165" r="20" fill="#0055cc" opacity="0.8" stroke="#003399" stroke-width="2"/>
  <text x="370" y="160" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff">Esto-</text>
  <text x="370" y="172" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff">cionam.</text>
  <!-- ponto C - referência supermercado -->
  <rect x="452" y="132" width="116" height="66" fill="#006600" opacity="0.75" stroke="#004400" stroke-width="2" rx="4"/>
  <text x="510" y="160" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">Super-</text>
  <text x="510" y="174" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">mercado</text>
  <!-- seta norte -->
  <polygon points="560,20 553,42 560,37 567,42" fill="#333"/>
  <text x="560" y="52" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#333">N</text>
  <!-- legenda -->
  <rect x="0" y="370" width="600" height="30" fill="#333" opacity="0.85"/>
  <rect x="10" y="378" width="12" height="12" fill="#cc0000"/>
  <text x="28" y="389" font-family="Arial" font-size="10" fill="#fff">AutoPro Oficina</text>
  <rect x="150" y="378" width="12" height="12" fill="#0055cc" rx="6"/>
  <text x="168" y="389" font-family="Arial" font-size="10" fill="#fff">Estacionamento</text>
  <rect x="310" y="378" width="12" height="12" fill="#006600"/>
  <text x="328" y="389" font-family="Arial" font-size="10" fill="#fff">Referência</text>
</svg>
