<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
  <!-- fundo -->
  <rect width="800" height="350" fill="#1a1a1a"/>
  <!-- faixa topo -->
  <rect x="0" y="0" width="800" height="10" fill="#cc0000"/>
  <!-- faixa base -->
  <rect x="0" y="340" width="800" height="10" fill="#cc0000"/>
  <!-- galpão -->
  <polygon points="100,300 700,300 700,150 400,80 100,150" fill="#2d2d2d" stroke="#cc0000" stroke-width="3"/>
  <!-- janela esq -->
  <rect x="150" y="190" width="80" height="80" fill="#3a3a3a" stroke="#555" stroke-width="1"/>
  <line x1="190" y1="190" x2="190" y2="270" stroke="#555" stroke-width="1"/>
  <line x1="150" y1="230" x2="230" y2="230" stroke="#555" stroke-width="1"/>
  <!-- janela dir -->
  <rect x="570" y="190" width="80" height="80" fill="#3a3a3a" stroke="#555" stroke-width="1"/>
  <line x1="610" y1="190" x2="610" y2="270" stroke="#555" stroke-width="1"/>
  <line x1="570" y1="230" x2="650" y2="230" stroke="#555" stroke-width="1"/>
  <!-- portão central -->
  <rect x="310" y="200" width="180" height="100" fill="#222" stroke="#cc0000" stroke-width="2"/>
  <line x1="400" y1="200" x2="400" y2="300" stroke="#cc0000" stroke-width="1"/>
  <line x1="310" y1="250" x2="490" y2="250" stroke="#333" stroke-width="1"/>
  <!-- carro -->
  <rect x="295" y="248" width="210" height="46" rx="8" fill="#444"/>
  <rect x="320" y="232" width="160" height="36" rx="6" fill="#555"/>
  <circle cx="335" cy="298" r="16" fill="#222" stroke="#777" stroke-width="3"/>
  <circle cx="335" cy="298" r="7"  fill="#555"/>
  <circle cx="465" cy="298" r="16" fill="#222" stroke="#777" stroke-width="3"/>
  <circle cx="465" cy="298" r="7"  fill="#555"/>
  <ellipse cx="473" cy="262" rx="10" ry="7" fill="#ffe066" opacity="0.85"/>
  <!-- placa -->
  <rect x="380" y="285" width="40" height="14" rx="2" fill="#fff"/>
  <text x="400" y="296" text-anchor="middle" font-family="Arial" font-size="7" fill="#000" font-weight="bold">AUTO PRO</text>
  <!-- texto -->
  <text x="400" y="328" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#cc0000">AutoPro — Oficina Mecânica</text>
</svg>
